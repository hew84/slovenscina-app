name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      # GitHub Pages serves the site under /<repository-name>/.
      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages answers unknown paths with 404.html; serving the app there makes deep links like /lesson/lesson-01 work.
      - name: SPA fallback
        run: cp dist/slovenscina-app/browser/index.html dist/slovenscina-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/slovenscina-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
